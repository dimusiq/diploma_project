[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]>=0.114.2,<1.0.0",
    "python-multipart>=0.0.7",
    "email-validator>=2.1.0.post1",
    "bcrypt>=4.1.0",
    "tenacity>=9.0",
    "pydantic>=2.0",
    "emails>=0.6,<1.0",
    "jinja2>=3.1.4",
    "alembic>=1.12.1",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.13",
    "sqlmodel>=0.0.21",
    "pydantic-settings>=2.2.1",
    "sentry-sdk[fastapi]>=2.0,<3.0",
    "pyjwt>=2.8.0",
    "reportlab>=4.0.0,<5.0.0",
    "svglib>=1.5.0,<2.0.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0,<12.0",
    "redis>=5.0,<8.0",
    "pgvector>=0.4.0,<0.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.2.2",
    "pre-commit>=4.0",
    "coverage>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

# ---------------------------------------------------------------------------
# TODO(P1-5 / mypy): поэтапное снятие ignore_errors до 2026-12-31.
# Сейчас 853 ошибки на 107 модулях (type-arg/union-attr/attr-defined/...).
# Порядок зачистки: warehouse_sim.* → api.routes.* → services.* → tests.*.
# Не расширять список без новой ошибки; при зелёном модуле — удалять из override.
# ---------------------------------------------------------------------------
