<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/vite.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2d3748" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sklad</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/images/favicon.png"
    />
    <link rel="apple-touch-icon" href="/images/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- До бандла: подавляем типичный шум от расширений (Grammarly и т.д.) в unhandledrejection -->
    <script>
      ;(function () {
        function isExtNoise(r) {
          if (r == null || typeof r !== "object") return false
          // REST приложения не отдаёт 403 в объекте при HTTP 200 — типично для content-scripts
          if (r.code === 403 && r.httpStatus === 200) return true
          if (
            r.httpError === false &&
            typeof r.httpStatus === "number" &&
            typeof r.code === "number"
          )
            return true
          return false
        }
        window.addEventListener(
          "unhandledrejection",
          function (e) {
            if (isExtNoise(e.reason)) e.preventDefault()
          },
          true,
        )
      })()
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
