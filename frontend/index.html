<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Склад" />
    <title>Склад</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- До бандла: подавляем типичный шум от расширений (Grammarly и т.д.) в unhandledrejection -->
    <script>
      ;(() => {
        function isExtNoise(r) {
          if (r == null || typeof r !== "object") return false
          if (r.code === 403 && r.httpStatus === 200) return true
          if (
            r.httpError === false &&
            typeof r.httpStatus === "number" &&
            typeof r.code === "number"
          )
            return true
          return false
        }
        window.addEventListener(
          "unhandledrejection",
          (e) => {
            if (isExtNoise(e.reason)) e.preventDefault()
          },
          true,
        )
      })()
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
