name: Lint Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - ".github/workflows/lint-backend.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "backend/**"
      - ".github/workflows/lint-backend.yml"

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.4.15"
          enable-cache: true
      # Ровно scripts/lint.sh: mypy → ruff check → ruff format --check (set -e).
      - name: Lint (mypy + ruff)
        run: uv run bash scripts/lint.sh
        working-directory: backend
